name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build portable Windows app
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CodexTokenBar-Windows-x64
          path: |
            dist/windows-x64/CodexTokenBar.exe
            dist/CodexTokenBar-Windows-x64-Setup.exe
          if-no-files-found: error
      - name: Publish Windows release files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $portable = "dist/windows-x64/CodexTokenBar.exe"
          $installer = "dist/CodexTokenBar-Windows-x64-Setup.exe"
          $checksums = "dist/SHA256SUMS-Windows.txt"
          @(
            "$(Get-FileHash -Algorithm SHA256 $portable | Select-Object -ExpandProperty Hash)  CodexTokenBar-Windows-x64.exe"
            "$(Get-FileHash -Algorithm SHA256 $installer | Select-Object -ExpandProperty Hash)  CodexTokenBar-Windows-x64-Setup.exe"
          ) | Set-Content -Encoding ascii $checksums
          Copy-Item $portable "dist/CodexTokenBar-Windows-x64.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --title $tag --generate-notes
          }
          gh release upload $tag `
            "dist/CodexTokenBar-Windows-x64.exe" `
            $installer `
            $checksums `
            --clobber
